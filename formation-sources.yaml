# ---
# SECRETS REQUIRED IN GITHUB ACTIONS
# Set these under repo Settings > Secrets and variables > Actions
# ---
# FIGMA_TOKEN           — Figma read-only PAT (Settings > Security > Personal access tokens)
# CONFLUENCE_API_TOKEN  — Atlassian API token (id.atlassian.com > Security > API tokens)
# CONFLUENCE_USER_EMAIL — andre.barros@fanduel.com
# SLACK_WEBHOOK         — Incoming webhook URL for #formation
# ARTIFACTORY_TOKEN     — Confirm with platform team: is CI read access available for @fanduel/npm?
# GH_PAT                — GitHub PAT with repo:write scope (for opening PRs from Actions)
