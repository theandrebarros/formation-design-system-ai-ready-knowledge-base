name: Deploy Showcase Deck

on:
  push:
    branches:
      - main
    paths:
      - "showcase-deck/**"
      - "figma-make/figma-make-guidelines.md"
      - ".github/workflows/deploy-showcase-deck.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync guidelines.md from source
        run: ./showcase-deck/sync-guidelines.sh

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase-deck

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
